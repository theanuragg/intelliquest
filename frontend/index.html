<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Document Automation Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        .status-bar {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4caf50;
        }

        .status-dot.offline {
            background: #f44336;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card h2 {
            margin-bottom: 15px;
            color: #333;
            font-size: 18px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 14px;
            font-weight: 500;
        }

        input, textarea, select {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: opacity 0.3s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .task-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .task-item {
            padding: 12px;
            border-left: 4px solid #667eea;
            margin-bottom: 10px;
            background: #f9f9f9;
            border-radius: 4px;
        }

        .task-item.completed {
            border-left-color: #4caf50;
        }

        .task-item.failed {
            border-left-color: #f44336;
        }

        .task-item.running {
            border-left-color: #ff9800;
        }

        .task-id {
            font-size: 12px;
            color: #999;
            font-family: monospace;
            margin-bottom: 5px;
        }

        .task-title {
            font-weight: 500;
            color: #333;
            margin-bottom: 5px;
        }

        .task-status {
            display: inline-block;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 3px;
            color: white;
            font-weight: 500;
        }

        .task-status.pending {
            background: #999;
        }

        .task-status.running {
            background: #ff9800;
        }

        .task-status.completed {
            background: #4caf50;
        }

        .task-status.failed {
            background: #f44336;
        }

        .downloads-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .file-item {
            padding: 10px;
            background: #f9f9f9;
            border-radius: 4px;
            border: 1px solid #ddd;
            text-align: center;
        }

        .file-name {
            font-size: 12px;
            margin-bottom: 5px;
            color: #333;
            word-break: break-all;
        }

        .file-size {
            font-size: 11px;
            color: #999;
            margin-bottom: 8px;
        }

        .file-link {
            display: inline-block;
            color: #667eea;
            text-decoration: none;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid #667eea;
            padding: 4px 8px;
            border-radius: 3px;
            transition: all 0.3s;
        }

        .file-link:hover {
            background: #667eea;
            color: white;
        }

        .message {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            border-bottom: 2px solid #ddd;
        }

        .tab {
            padding: 10px 15px;
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .json-viewer {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 12px;
            overflow-x: auto;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🤖 AI Document Automation Engine</h1>
            <div class="status-bar">
                <div class="status-item">
                    <div class="status-dot" id="healthDot"></div>
                    <span>System: <span id="healthStatus">Checking...</span></span>
                </div>
                <div class="status-item">
                    <span>Active Tasks: <span id="activeTaskCount">0</span></span>
                </div>
                <div class="status-item">
                    <span>Model: Fara-7B</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Create Task Card -->
            <div class="card">
                <h2>Create Task</h2>
                <div id="taskMessage"></div>
                <div class="form-group">
                    <label for="objective">Objective</label>
                    <textarea id="objective" placeholder="Enter automation objective (e.g., 'Login to website, download invoice, extract data')"></textarea>
                </div>
                <div class="form-group">
                    <label for="params">Parameters (JSON)</label>
                    <textarea id="params" placeholder='{"key": "value"}' style="min-height: 60px;"></textarea>
                </div>
                <button onclick="createTask()">Create & Execute Task</button>
            </div>

            <!-- Task List Card -->
            <div class="card">
                <h2>Active Tasks</h2>
                <div class="task-list" id="taskList">
                    <div style="color: #999; text-align: center; padding: 20px;">No tasks yet</div>
                </div>
            </div>

            <!-- Downloads Card -->
            <div class="card full-width">
                <h2>Downloaded Files</h2>
                <button onclick="refreshDownloads()" style="margin-bottom: 15px;">Refresh</button>
                <div class="downloads-grid" id="downloadsList">
                    <div style="color: #999; grid-column: 1 / -1; text-align: center; padding: 20px;">No downloads yet</div>
                </div>
            </div>

            <!-- Task Details Card -->
            <div class="card full-width">
                <h2>Task Details & Audit Log</h2>
                <div class="form-group">
                    <label for="taskIdInput">Task ID</label>
                    <input type="text" id="taskIdInput" placeholder="Paste task ID to view details">
                </div>
                <button onclick="loadTaskDetails()">Load Details</button>
                <div id="taskDetailsMessage"></div>

                <div class="tabs" style="margin-top: 20px;">
                    <button class="tab active" onclick="switchTab('result')">Result</button>
                    <button class="tab" onclick="switchTab('audit')">Audit Log</button>
                </div>

                <div id="result" class="tab-content active">
                    <div id="resultViewer" class="json-viewer">-</div>
                </div>

                <div id="audit" class="tab-content">
                    <div id="auditViewer" class="json-viewer">-</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let refreshInterval;

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            checkHealth();
            refreshTaskList();
            refreshDownloads();
            refreshInterval = setInterval(() => {
                refreshTaskList();
                checkHealth();
            }, 3000);
        });

        // Health check
        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                document.getElementById('healthDot').className = 'status-dot';
                document.getElementById('healthStatus').textContent = 'Online';
            } catch (e) {
                document.getElementById('healthDot').className = 'status-dot offline';
                document.getElementById('healthStatus').textContent = 'Offline';
            }
        }

        // Create task
        async function createTask() {
            const objective = document.getElementById('objective').value;
            const paramsStr = document.getElementById('params').value;

            if (!objective.trim()) {
                showMessage('taskMessage', 'Please enter an objective', 'error');
                return;
            }

            let params = {};
            if (paramsStr.trim()) {
                try {
                    params = JSON.parse(paramsStr);
                } catch (e) {
                    showMessage('taskMessage', 'Invalid JSON parameters', 'error');
                    return;
                }
            }

            try {
                const response = await fetch(`${API_BASE}/tasks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ objective, params })
                });

                const data = await response.json();
                showMessage('taskMessage', `Task created: ${data.task_id}`, 'success');
                document.getElementById('objective').value = '';
                document.getElementById('params').value = '';
                refreshTaskList();
            } catch (e) {
                showMessage('taskMessage', `Error: ${e.message}`, 'error');
            }
        }

        // Refresh task list
        async function refreshTaskList() {
            try {
                const response = await fetch(`${API_BASE}/tasks`);
                const tasks = await response.json();

                const taskList = document.getElementById('taskList');
                if (tasks.length === 0) {
                    taskList.innerHTML = '<div style="color: #999; text-align: center; padding: 20px;">No tasks yet</div>';
                    document.getElementById('activeTaskCount').textContent = '0';
                    return;
                }

                let activeCount = tasks.filter(t => t.status === 'running' || t.status === 'queued').length;
                document.getElementById('activeTaskCount').textContent = activeCount;

                taskList.innerHTML = tasks.map(task => `
                    <div class="task-item ${task.status}">
                        <div class="task-id">ID: ${task.task_id.substring(0, 8)}...</div>
                        <div class="task-title">${task.objective.substring(0, 50)}...</div>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <span class="task-status ${task.status}">${task.status.toUpperCase()}</span>
                            ${task.status === 'running' ? '<span class="loading"></span>' : ''}
                            <span style="font-size: 12px; color: #999;">${task.num_actions} actions</span>
                        </div>
                        <button style="margin-top: 8px; padding: 4px 8px; font-size: 12px;" onclick="copyTaskId('${task.task_id}')">Copy ID</button>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Error refreshing tasks:', e);
            }
        }

        // Refresh downloads
        async function refreshDownloads() {
            try {
                const response = await fetch(`${API_BASE}/downloads`);
                const files = await response.json();

                const downloadsList = document.getElementById('downloadsList');
                if (files.length === 0) {
                    downloadsList.innerHTML = '<div style="color: #999; grid-column: 1 / -1; text-align: center; padding: 20px;">No downloads yet</div>';
                    return;
                }

                downloadsList.innerHTML = files.map(file => `
                    <div class="file-item">
                        <div class="file-name">📄 ${file.name}</div>
                        <div class="file-size">${formatFileSize(file.size)}</div>
                        <a class="file-link" href="${API_BASE}/downloads/${encodeURIComponent(file.name)}" download>Download</a>
                    </div>
                `).join('');
            } catch (e) {
                console.error('Error refreshing downloads:', e);
            }
        }

        // Load task details
        async function loadTaskDetails() {
            const taskId = document.getElementById('taskIdInput').value.trim();
            if (!taskId) {
                showMessage('taskDetailsMessage', 'Please enter a task ID', 'error');
                return;
            }

            try {
                const resultResponse = await fetch(`${API_BASE}/tasks/${taskId}/result`);
                const auditResponse = await fetch(`${API_BASE}/tasks/${taskId}/audit`);

                if (!resultResponse.ok || !auditResponse.ok) {
                    showMessage('taskDetailsMessage', 'Task not found', 'error');
                    return;
                }

                const result = await resultResponse.json();
                const audit = await auditResponse.json();

                document.getElementById('resultViewer').textContent = JSON.stringify(result, null, 2);
                document.getElementById('auditViewer').textContent = JSON.stringify(audit, null, 2);
                showMessage('taskDetailsMessage', 'Task details loaded', 'success');
            } catch (e) {
                showMessage('taskDetailsMessage', `Error: ${e.message}`, 'error');
            }
        }

        // Switch tabs
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tab).classList.add('active');
        }

        // Utility functions
        function copyTaskId(taskId) {
            navigator.clipboard.writeText(taskId);
            showMessage('taskMessage', 'Task ID copied!', 'success');
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="message ${type}">${message}</div>`;
            setTimeout(() => {
                element.innerHTML = '';
            }, 5000);
        }
    </script>
</body>
</html>
